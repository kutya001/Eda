<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Прототип Eda v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=JetBrains+Mono:wght@400;600&display=swap">
<!-- Тема применяется до отрисовки, без вспышки; ключ = APP.prefix + '.theme' -->
<script>try{var __t=localStorage.getItem('eda.theme');if(__t==='light'||__t==='dark')document.documentElement.setAttribute('data-theme',__t)}catch(e){}</script>
<!-- Стили: src/css. Сборка (build.py) объединяет их в один <style> -->
<link rel="stylesheet" href="src/css/base.css">
<link rel="stylesheet" href="src/css/shell.css">
<link rel="stylesheet" href="src/css/controls.css">
<link rel="stylesheet" href="src/css/grid.css">
<link rel="stylesheet" href="src/css/popups.css">
<link rel="stylesheet" href="src/css/kb.css">
<link rel="stylesheet" href="src/css/cards.css">

<link rel="stylesheet" href="src/css/eda.css">
<link rel="stylesheet" href="src/css/mobile.css">
</head><body>

<div class="app" id="app">
  <header class="topbar" id="topbar">
    <button class="icon-btn tb-other" id="burger" aria-label="Меню" title="Меню"></button>
    <button class="tb-title tb-other" id="tb-title" type="button"><b id="tb-mod"></b><span id="tb-tab"></span></button><button class="icon-btn sm tb-info tb-other" id="tb-info" type="button" aria-label="Описание модуля"></button>
    <div class="tb-search">
      <div class="search" role="search">
        <span id="search-ic"></span>
        <input id="q" type="search" placeholder="Поиск по текущей вкладке" autocomplete="off" aria-label="Поиск по текущей вкладке">
        <span class="scope" id="q-scope"></span>
      </div>
      <button class="icon-btn tb-mobile" id="q-open" aria-label="Поиск"></button>
    </div>
    <button class="btn ghost sm tb-other tb-org" id="org-sw" type="button" title="Организация" hidden></button>
    <div class="clock tb-other" id="clock" aria-live="off"></div>
    <button class="icon-btn tb-other tb-bell" id="bell" aria-label="Уведомления" title="Уведомления"></button>
    <button class="icon-btn tb-other" id="help" aria-label="Помощь" title="Помощь по модулю"></button>
    <button class="icon-btn tb-other" id="theme" aria-label="Переключить тему" title="Светлая / тёмная тема"></button>
  </header>
  <aside class="side" id="side" aria-label="Модули"></aside>
  <main class="pane" id="pane"><div class="page" id="page"></div></main>
  <nav class="bnav" id="bnav" aria-label="Модули"></nav>
</div>
<button class="fab" id="fab" aria-label="Добавить" hidden></button>
<div class="sheet-cover" id="sheet-cover" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Меню"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<!-- Скрипты: src/js. Порядок важен: файл может при загрузке вызывать только то, что объявлено выше.
     modules/common.js — общие расчёты (меню, заказы, остатки, долги), поэтому первым из модулей;
     core/registry.js ссылается на функции всех модулей, поэтому подключается после них. Сборка (build.py) объединяет их в один <script> -->
